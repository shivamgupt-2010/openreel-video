[build]
  publish = "apps/web/dist"
  command = "pnpm --filter @openreel/web build && node -e \"const fs=require('fs'); ['dist', 'apps/web/dist'].forEach(d => { fs.rmSync(d, {recursive: true, force: true}); fs.mkdirSync(d, {recursive: true}); fs.cpSync('../web/dist', d, {recursive: true}); });\""

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.5"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
