[build]
  publish = "apps/web/dist"
  command = "pnpm --filter @openreel/web build && node -e \"const fs=require('fs'), path=require('path'); const src = path.resolve(process.cwd(), process.cwd().endsWith('apps/cloud') ? '../web/dist' : 'apps/web/dist'); ['dist', 'apps/web/dist', path.resolve(process.cwd(), 'apps/web/dist')].forEach(dest => { try { fs.mkdirSync(dest, {recursive: true}); fs.cpSync(src, dest, {recursive: true}); } catch(e){} });\""

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.5"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
