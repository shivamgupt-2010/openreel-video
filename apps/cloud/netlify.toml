[build]
  publish = "dist"
  command = "pnpm --filter @openreel/web build && node -e \"const fs=require('fs'); fs.rmSync('./dist', {recursive: true, force: true}); fs.cpSync('../web/dist', './dist', {recursive: true});\""

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
